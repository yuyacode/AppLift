AWSTemplateFormatVersion: '2010-09-09'
Description: Define a Role for AppLiftStudent.

Resources:
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ECSTaskRoleStudent
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "GetSecretValuePolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "secretsmanager:GetSecretValue"
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*"

Outputs:
  ECSTaskRoleArn:
    Description: ARN of the ECS Task Role for AppLiftStudent
    Value: !GetAtt ECSTaskRole.Arn
