AWSTemplateFormatVersion: '2010-09-09'
Description: Defines the Secrets Manager Secret for the AppLiftStudent.

Resources:
  AppKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: AppLiftStudent/laravel/app-key
      Description: Laravel APP_KEY for the AppLiftStudent.
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W77
            reason: "This secret does not require cross-account sharing and using the default AWS-managed key is acceptable."
  MessageApiKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: AppLiftStudent/message-api-key
      Description: MESSAGE_API_KEY for the AppLiftStudent.
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W77
            reason: "This secret does not require cross-account sharing and using the default AWS-managed key is acceptable."
  MessageApiEndpoint:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: AppLiftStudent/message-api-endpoint
      Description: MESSAGE_API_ENDPOINT for the AppLiftStudent.
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W77
            reason: "This secret does not require cross-account sharing and using the default AWS-managed key is acceptable."

Outputs:
  AppKeyArn:
    Description: The ARN of the Secrets Manager secret for AppLiftStudent APP_KEY.
    Value: !Ref AppKey
    Export:
      Name: !Sub "${AWS::StackName}-AppKeyArn"
  MessageApiKeyArn:
    Description: The ARN of the Secrets Manager secret for AppLiftStudent MESSAGE_API_KEY.
    Value: !Ref MessageApiKey
    Export:
      Name: !Sub "${AWS::StackName}-MessageApiKeyArn"
  MessageApiEndpointArn:
    Description: The ARN of the Secrets Manager secret for AppLiftStudent MESSAGE_API_ENDPOINT.
    Value: !Ref MessageApiEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-MessageApiEndpointArn"
