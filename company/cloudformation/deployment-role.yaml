AWSTemplateFormatVersion: "2010-09-09"
Description: >
  This CloudFormation template creates an IAM Role that allow GitHub Actions to assume the role and deploy AWS resources securely.
  This single template can be expanded in the future to include multiple roles for various resource types.

Parameters:
  GitHubOIDCProviderArn:
    Type: String
  AWSAccountID:
    Type: String
    Description: "The 12-digit AWS Account ID"
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: "Must be a 12-digit AWS account ID."

Resources:
  ECRDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ECRDeploymentRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProviderArn
            Action: 
              - "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: "sts.amazonaws.com"
              StringLike:
                "token.actions.githubusercontent.com:sub": "repo:yuyacode/AppLift:*"
      Policies:
        - PolicyName: "CloudFormationStackManagementPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "cloudformation:CreateChangeSet"
                  - "cloudformation:DeleteChangeSet"
                  - "cloudformation:DescribeChangeSet"
                  - "cloudformation:ExecuteChangeSet"
                  - "cloudformation:CreateStack"
                  - "cloudformation:UpdateStack"
                  - "cloudformation:DeleteStack"
                  - "cloudformation:DescribeStacks"
                  - "cloudformation:DescribeStackEvents"
                  - "cloudformation:DescribeStackResources"
                  - "cloudformation:DescribeStackDriftDetectionStatus"
                  - "cloudformation:GetTemplate"
                  - "cloudformation:GetTemplateSummary"
                  - "cloudformation:ListStackResources"
                Resource: "*"
        - PolicyName: "ECRRepositoryCreatePolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ecr:CreateRepository"
                Resource: "*"
        - PolicyName: "ECRRepositoryManagementPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ecr:DescribeRepositories"
                  - "ecr:DeleteRepository"
                  - "ecr:PutImageScanningConfiguration"
                  - "ecr:PutLifecyclePolicy"
                  - "ecr:GetLifecyclePolicy"
                  - "ecr:ListImages"
                  - "ecr:BatchDeleteImage"
                Resource: "arn:aws:ecr:ap-northeast-1:${AWSAccountID}:repository/app_lift_company"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: >
              This IAM role is assumed by GitHub Actions for infrastructure deployment using CloudFormation templates.
              The templates dynamically create and manage various AWS resources.
              Due to the dynamic and flexible nature of the deployment process, it is not feasible to predefine specific resource ARNs.
              Instead, the policy strictly limits allowed actions to the minimum set necessary for infrastructure provisioning.
          - id: W28
            reason: "Fixed role name is required so that GitHub Actions can reliably assume this IAM role using its ARN."

Outputs:
  ECRDeploymentRoleArn:
    Description: "ARN of the IAM Role for ECR Repository deployment"
    Value: !GetAtt ECRDeploymentRole.Arn
