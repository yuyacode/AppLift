name: Company CICD

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  php-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: company/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('company/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          cd company
          composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup .env.testing and DB
        run: |
          cd company
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing
          touch database/{company.sqlite,student.sqlite,common.sqlite}

      - name: Run tests
        run: |
          cd company
          php artisan test

  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Add cfn-lint problem matcher
        run: echo "::add-matcher::.github/cfn-lint.json"

      - name: Run cfn-lint
        run: |
          files="cloudformation/company/ecr.yaml"
          for file in $files; do
            cfn-lint "$file" -f parseable
          done

  cfn-nag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'

      - name: Install cfn-nag
        run: gem install cfn-nag

      - name: Run cfn-nag
        run: |
          files="cloudformation/company/ecr.yaml"
          for file in $files; do
            cfn_nag "$file"
          done

