  # ───────────────────────────────────────────────────────────────
  # 【事前準備】ECSサービス用Service-Linked-Roleの作成
  # 
  # デプロイ先環境にまだService-Linked-Role「AWSServiceRoleForECS」が存在しない場合、以下のコマンドを実行して、手動で作成してください。
  # 
  #   aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com
  # 
  # ※cloudformationテンプレートの可搬性を高めるため、Service-Linked-Roleは手動で作成する運用としています。
  # ※このロールはECSが内部的にENIの作成やALB登録を行う際に必須となります。
  # ───────────────────────────────────────────────────────────────
  deploy-ecs:
    needs: [build_and_push_image, deploy-secrets-manager]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECS_SERVICE_TASK_DEPLOYMENT_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy ECS Service and Task
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/student/ecs.yaml \
            --stack-name Student-ECS \
            --parameter-overrides \
              AWSAccountID=853412075128 \
              ECRRepositoryName=${{ secrets.STUDENT_ECR_REPOSITORY_NAME }} \
              ImageTag=${{ needs.build_and_push_image.outputs.image_tag }} \
              NetworkStackName=Network-Stack \
              SecretsManagerStackName=Student-Secrets-Manager \
              DBStackName=DB \
              ExecutionRoleStackName=ECS-Task-Execution-Role \
              RoleStackName=Student-Role \
              ECSClusterStackName=ECS-Cluster \
              ALBStackName=ALB \
              SGStackName=Security-Group

  deploy-role:
    # needs: [php-unit, cfn-lint, cfn-nag]
    needs: [cfn-lint, cfn-nag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE_STACK_DEPLOYMENT_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy Role
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/student/role.yaml \
            --stack-name Student-Role \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM
