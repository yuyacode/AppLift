  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Add cfn-lint problem matcher
        run: echo "::add-matcher::.github/cfn-lint.json"

      - name: Run cfn-lint
        run: |
          files="cloudformation/student/ecr.yaml cloudformation/student/cloudwatch.yaml cloudformation/student/role.yaml cloudformation/student/ecs.yaml cloudformation/student/secrets-manager.yaml"
          for file in $files; do
            cfn-lint "$file" -f parseable
          done

  cfn-nag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'

      - name: Install cfn-nag
        run: gem install cfn-nag

      - name: Run cfn-nag
        run: |
          files="cloudformation/student/ecr.yaml cloudformation/student/cloudwatch.yaml cloudformation/student/role.yaml cloudformation/student/ecs.yaml cloudformation/student/secrets-manager.yaml"
          for file in $files; do
            cfn_nag "$file"
          done

  deploy-log_group:
    # needs: [php-unit, cfn-lint, cfn-nag]
    needs: [cfn-lint, cfn-nag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.LOG_GROUP_DEPLOYMENT_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy Log Group
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/student/cloudwatch.yaml \
            --stack-name Student-Log-Group

  deploy-secrets-manager:
    # needs: [php-unit, cfn-lint, cfn-nag]
    needs: [cfn-lint, cfn-nag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SECRETS_MANAGER_DEPLOYMENT_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy Secrets Manager
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/student/secrets-manager.yaml \
            --stack-name Student-Secrets-Manager

  deploy-ecr:
    # needs: [php-unit, cfn-lint, cfn-nag]
    needs: [cfn-lint, cfn-nag]
